name: Source quality and regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Prepare pinned development tools
        run: |
          python3 -B - <<'PY'
          import subprocess, sys
          result = subprocess.run([sys.executable, '-m', 'pip', '--isolated', 'install', '-r', 'requirements-dev.txt'], capture_output=True, timeout=180)
          print(f'[1/2] Tool preparation exit={result.returncode}; raw installer streams discarded')
          sys.exit(result.returncode)
          PY
      - name: Quality, collection, regressions and exact coverage
        run: |
          python3 -B - <<'PY'
          import ast, json, os, pathlib, re, subprocess, sys, tempfile, time
          start = time.monotonic()
          with tempfile.TemporaryDirectory(prefix='yggctl-ci-', dir=os.environ['RUNNER_TEMP']) as state:
              os.environ['COVERAGE_FILE'] = state + '/coverage.db'
              os.environ['HYPOTHESIS_STORAGE_DIRECTORY'] = state + '/hypothesis'
              files = sorted(pathlib.Path('yggctl').rglob('*.py')) + sorted(pathlib.Path('tests').glob('*.py'))
              for path in files:
                  ast.parse(path.read_text(), filename=str(path))
              print(f'[1/9] Syntax processed={len(files)}/{len(files)} errors=0 remaining=8', flush=True)
              commands = [
                  ['ruff', 'check', '--no-cache', '--output-format=json', '.'],
                  ['ruff', 'format', '--no-cache', '--check', '.'],
                  ['mypy', '--cache-dir', state + '/mypy'],
                  ['bandit', '-q', '-r', 'yggctl', 'tests', '-f', 'custom', '--msg-template', 'FINDING:{test_id}'],
                  ['bandit', '-q', '-r', 'yggctl', 'tests', '-lll', '-f', 'json'],
                  [sys.executable, '-m', 'pytest', '--collect-only', '-q', '-o', 'cache_dir=' + state + '/pytest'],
                  [sys.executable, '-m', 'coverage', 'run', '-m', 'pytest', '-q', '-o', 'cache_dir=' + state + '/pytest'],
                  [sys.executable, '-m', 'coverage', 'json', '-o', '-'],
              ]
              for index, command in enumerate(commands, 2):
                  result = subprocess.run(command, capture_output=True, timeout=120)
                  if result.returncode:
                      print(f'[{index}/9] FAIL exit={result.returncode}; raw diagnostics discarded', flush=True)
                      sys.exit(1)
                  if index == 2 and json.loads(result.stdout) != []:
                      raise SystemExit('invalid Ruff success report')
                  if index == 6:
                      report = json.loads(result.stdout)
                      if report['errors'] or report['results']:
                          raise SystemExit('Bandit scan incomplete or high findings')
                  if index == 8 and not re.search(rb'\b[1-9][0-9]* passed\b', result.stdout):
                      raise SystemExit('missing test-success witness')
                  if index == 9:
                      totals = json.loads(result.stdout)['totals']
                      if not totals['num_statements'] or not totals['num_branches'] or totals['missing_lines'] or totals['missing_branches'] or totals['excluded_lines']:
                          raise SystemExit('coverage must include every production statement and branch without exclusions')
                      print('Coverage: 100% lines and branches; zero exclusions', flush=True)
                  print(f'[{index}/9] PASS processed={index}/9 remaining={9-index} elapsed={time.monotonic()-start:.1f}s', flush=True)
          print(f'[done] processed=9/9 errors=0 remaining=0 elapsed={time.monotonic()-start:.1f}s')
          PY
